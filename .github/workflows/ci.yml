name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-sing-box-ui-linux-arm64
          path: dist/keenetic-sing-box-ui-linux-arm64

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # теги и история для changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make package
      - run: scripts/changelog.sh notes "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
      # KeeneticOS качает установщик без редиректов и только как
      # application/octet-stream — GitHub Releases не подходит, raw.githubusercontent
      # подходит. Ветка installer — один коммит с последним архивом.
      - name: Publish installer branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=$(mktemp -d)
          cp dist/keenetic-sing-box-ui-installer-aarch64.tar.gz "$dir/"
          printf 'Установочный архив keenetic-sing-box-ui %s для KeeneticOS — см. README в main.\n' "$GITHUB_REF_NAME" > "$dir/README.md"
          cd "$dir"
          git init -q -b installer
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "installer $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" installer
